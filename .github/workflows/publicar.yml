name: Publicar el catálogo

# Cada cambio de datos en main es una versión: Otteretro baja la más reciente cuyo tag empieza con `catalogo-`.
on:
  push:
    branches: [main]
    paths: ["catalogo/**"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para leer el catálogo de la versión anterior

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compilar la herramienta
        run: dotnet build src/Otteretro -p:OutputType=Exe

      - name: Compilar el catálogo
        run: src/Otteretro/bin/Debug/net10.0/OtteretroCatalogo.exe catalogo compilar catalogo salida/catalogo.db.gz

      # #44: un cambio que no cambia la base compilada (formato, código) no es una versión nueva: Otteretro no la lista.
      - name: ¿Cambió la base?
        id: base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'catalogo-*' } |
            Sort-Object createdAt -Descending | Select-Object -First 1
          $changed = $true
          if ($previous) {
            gh release download $previous.tagName -p catalogo.db.gz.json -D manifiesto-anterior
            if ($LASTEXITCODE -eq 0) {
              # El hash de los datos, no el del archivo: comprimir dos veces lo mismo no da los mismos bytes. Las versiones de antes de #44 no lo tienen.
              $before = (Get-Content manifiesto-anterior/catalogo.db.gz.json | ConvertFrom-Json).content
              $now = (Get-Content salida/catalogo.db.gz.json | ConvertFrom-Json).content
              $changed = -not $before -or $before -ne $now
            }
            $global:LASTEXITCODE = 0
          }
          if (-not $changed) { "La base es igual a la de $($previous.tagName): no se publica." }
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Versión
        if: steps.base.outputs.changed == 'true'
        shell: pwsh
        run: '"TAG=catalogo-$(Get-Date -AsUTC -Format ''yyyyMMdd-HHmm'')-$("${{ github.sha }}".Substring(0, 7))" >> $env:GITHUB_ENV'

      # #31: cambios.json lleva todo el historial (la app puede venir de cualquier versión) y lo que cambió desde la anterior.
      - name: Cambios desde la versión anterior
        if: steps.base.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'catalogo-*' } |
            Sort-Object createdAt -Descending | Select-Object -First 1
          $extra = @()
          if ($previous) {
            $sha = $previous.tagName.Split('-')[-1]
            New-Item -ItemType Directory anterior | Out-Null
            git archive -o anterior.tar $sha catalogo
            tar -xf anterior.tar -C anterior
            gh release download $previous.tagName -p cambios.json -D historial
            if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 } # las versiones de antes de #31 no lo tienen
            $extra = @("anterior/catalogo", $previous.tagName)
            if (Test-Path historial/cambios.json) { $extra += "historial/cambios.json" }
          }
          src/Otteretro/bin/Debug/net10.0/OtteretroCatalogo.exe catalogo cambios catalogo $env:TAG salida/cambios.json @extra

      - name: Publicar
        if: steps.base.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG salida/catalogo.db.gz salida/catalogo.db.gz.json salida/cambios.json --title $env:TAG --notes "Datos de juegos: IGDB.com" --latest=false

      - name: Conservar solo las últimas 3 versiones de datos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Velopack solo mira las últimas 10 releases del repo (#12): lo viejo no debe tapar las versiones del programa.
          gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'catalogo-*' } |
            Sort-Object createdAt -Descending | Select-Object -Skip 3 | ForEach-Object { gh release delete $_.tagName --yes --cleanup-tag }
